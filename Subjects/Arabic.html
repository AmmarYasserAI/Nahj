<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAHJ</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style2.css" />
    <link
        rel="icon"
        href="images/logo/nahj_icon-removebg-preview.png"
        type="image/png"
    />
    <style>
        * {
            font-family: Verdana, Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        header {
            background-color: #f5f5f5;
            width: 100%;
            position: fixed;
            z-index: 999;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 10px 10px 100px rgba(94, 94, 94, 0.2);
            transition: 0.3s ease;
            top: 0;
        }
        .logo {
            width: 13em;
            object-fit: cover;
            animation: logoAnimation 1s ease-in-out;
        }
        @keyframes logoAnimation {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .nav {
            display: flex;
            align-items: center;
            font-size: 2em;
            margin-left: auto;
        }
        .nav a {
            color: #0f7e76;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 1.1em;
            font-weight: 650;
            transition: 0.6s ease;
            animation: navLinkAnimation 1s ease-in-out;
        }
        .nav h4 {
            padding-right: 22em;
            color: black;
            text-shadow: 0 0 10px #acacac;
        }
        .nav h4:hover {
            scale: 1.1;
            padding-right: 21em;
        }
        @keyframes navLinkAnimation {
            0% {
                transform: translateY(10px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .nav a:hover {
            font-size: 1.2em;
            color: #0900b1;
            transform: translateY(-2px);
        }
        main {
            margin-top: 60px;
            padding-bottom: 60px;
            text-align: center;
            direction: rtl; /* Right-to-left text direction */
        }
        .pdf-container {
            margin: 20px auto;
            text-align: center;
        }
        .pdf-container embed {
            width: 100%;
            height: 600px;
        }
        .download-link {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            font-size: 1.2em;
            color: #fff;
            background-color: #0f7e76;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .download-link:hover {
            background-color: #0e6c6b;
            transform: scale(1.05);
        }
        .download-link i {
            margin-right: 10px;
        }
        footer {
            background: #f5f5f5;
            padding: 10px;
            border-top: 1px solid #ddd;
            text-align: center;
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 10;
        }
        @media (max-width: 1023px) {
            .logo {
                width: 10em;
            }
            .nav h4 {
                font-size: 0.8em;
                padding-right: 100px;
            }
        }
        @media (max-width: 641px) {
            body {
                font-size: 12px;
            }
            .main-content h2 {
                font-size: 0.8em;
            }
            .main-content h3 {
                font-size: 1.4em;
            }
        }
        @media (max-width: 300px) {
            body {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img
            src="images/logo/Main_logopng-removebg-preview.png"
            class="logo"
            alt="Main Logo"
        />
        <nav class="nav">
            <h4><i class="fas fa-language"></i> اللغة العربية</h4>
            <a href="index.html"><i class="fas fa-home"></i></a>
        </nav>
    </header>

    <main>
        <h1>الملخص النحوي</h1>
        <p>يمكنك مشاهدة الملف PDF المدمج أدناه وتنزيله من خلال الرابط المقدم.</p>

        <div class="pdf-container">
            <embed src="نحو.pdf" type="application/pdf" />
        </div>

        <a href="نحو.pdf" download class="download-link">
            <i class="fas fa-download"></i> تنزيل ملف PDF
        </a>
    </main>

    <footer>
        <p>&copy; 2024 Ammar Yasser. All rights reserved.</p>
    </footer>
</body>
</html>
